name: Auto Sync from Google Sheet

on:
  schedule:
    # Runs every 6 hours automatically (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl python-docx

      - name: Sync Data from Google Sheet
        run: |
          python sync_from_google_sheet.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated portal database and index files
          git add index.html meetings_db.json
          git add -f BTRC_Meeting_Portal_Package/index.html BTRC_Meeting_Portal_Package/meetings_db.json || true
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "🤖 Auto-synced latest meeting data from Google Sheet [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new changes detected in Google Sheet."
          fi
