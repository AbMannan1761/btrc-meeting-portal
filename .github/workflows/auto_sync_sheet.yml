name: Auto Sync from Google Sheet

on:
  schedule:
    # Runs every 6 hours automatically (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl python-docx

      - name: Sync Data from Google Sheet
        run: |
          python sync_from_google_sheet.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html meetings_db.json extracted_agendas_live.xlsx "cm word copy" BTRC_Meeting_Portal_Package/
          if git diff --staged --quiet; then
            echo "No updates found in Google Sheet."
          else
            git commit -m "🤖 Auto-synced latest meeting data from Google Sheet [skip ci]"
            git push origin main
          fi
